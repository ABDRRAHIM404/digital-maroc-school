/* Mise en page : barre latérale des leçons à gauche, une leçon à la fois à droite (cours → application → exercice).
   Aspect clair unique, choisi pour la projection, cohérent avec les présentations de la formation. */
:root{
  --ink:#10233F; --paper:#FFFFFF; --mist:#EDF3F9; --line:#CFDCE8; --signal:#1786C7;
  --amber:#F2A33A; --amber-soft:#FFF2DF; --leaf:#23966A; --leaf-soft:#E3F4EC; --rose:#D3445C; --rose-soft:#FBE6EA;
  --muted:#53647A; --codebg:#14213A; --codefg:#E7EEF7;
  --display:"Lexend","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",Consolas,"Courier New",monospace;
  --s:1; color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--display);font-size:calc(17px*var(--s));line-height:1.55}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100%}
aside.nav{background:var(--ink);color:#fff;padding:28px 18px;position:sticky;top:0;height:100vh;overflow:auto;box-sizing:border-box;
  padding-left:max(18px,env(safe-area-inset-left,0px))}
.brand{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:600;margin:0 8px 6px}
.nav h1{font-size:26px;margin:0 8px 22px;line-height:1.2;font-weight:800}
.nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;counter-reset:l}
.nav a{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;color:#D7E3F1;text-decoration:none;padding:9px 10px;border-radius:10px;font-size:15px}
.nav a span.n{font-family:var(--mono);font-size:13px;color:#7F97B5}
.nav a:hover{background:#1B3456;color:#fff}
.nav a[aria-current="page"]{background:var(--signal);color:#fff}
.nav a[aria-current="page"] span.n{color:#fff}
.tools{display:flex;gap:8px;margin:24px 8px 0;align-items:center;font-size:13px;color:#9FB3CC}
.tools button{background:#1F3556;color:#fff;border:0;border-radius:8px;padding:6px 10px;font:600 14px var(--display);cursor:pointer}
.tools button:hover{background:var(--signal)}

main{padding-block:40px 80px;padding-left:max(16px,min(56px,4vw));padding-right:max(16px,env(safe-area-inset-right,0px),min(56px,4vw));min-width:0}
.wrap{max-width:1180px;margin:0 auto}
.eyebrow{font-size:calc(13px*var(--s));letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--signal)}
h2.title{font-size:calc(40px*var(--s));line-height:1.1;margin:6px 0 10px;font-weight:800;text-wrap:balance}
.intro{font-size:calc(20px*var(--s));color:var(--muted);max-width:760px;margin:0 0 30px}
h3.part{display:flex;align-items:center;gap:12px;font-size:calc(24px*var(--s));margin:44px 0 16px;font-weight:800}
h3.part .tag{font-size:calc(12px*var(--s));letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:999px;font-weight:600}
.t-cours{background:var(--mist);color:var(--signal)}.t-app{background:var(--amber-soft);color:#A0620A}.t-exo{background:var(--leaf-soft);color:var(--leaf)}

.cours{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
.cours p{margin:0 0 12px;max-width:65ch}
.cours ul.points{margin:0;padding-left:22px}.cours ul.points li{margin-bottom:8px}
.syntax{background:var(--mist);border-radius:16px;padding:20px 22px}
.syntax h4{margin:0 0 10px;font-size:calc(14px*var(--s));letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.syntax table{width:100%;border-collapse:collapse;font-size:calc(15px*var(--s))}
.syntax td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.syntax td:first-child{white-space:nowrap}
code,.c{font-family:var(--mono);font-size:.9em;background:var(--mist);padding:1px 7px;border-radius:6px;color:var(--ink)}
.syntax code{background:var(--paper)}
.tip{margin-top:16px;background:var(--amber-soft);border-radius:14px;padding:14px 18px}
.tip b{color:#A0620A}

/* éditeur + aperçu */
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper)}
.pane{display:flex;flex-direction:column;min-width:0}
.pane-h{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--mist);font:calc(13px*var(--s)) var(--mono);color:var(--muted);border-bottom:2px solid var(--line);min-height:40px;box-sizing:border-box}
.pane-h .dots{display:flex;gap:6px}.pane-h .dots i{width:10px;height:10px;border-radius:50%;background:#C3CEDA;display:block}
.pane-h .grow{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pane.code .pane-h{background:#0F1A2E;color:#9FB3CC;border-color:#0F1A2E}
textarea.ed{flex:1;min-height:calc(330px*var(--s));resize:vertical;border:0;margin:0;padding:16px 18px;background:var(--codebg);color:var(--codefg);
  font:calc(15px*var(--s))/1.6 var(--mono);tab-size:2;outline:none;white-space:pre;overflow:auto}
textarea.ed:focus-visible{box-shadow:inset 0 0 0 3px var(--signal)}
iframe.pv{flex:1;border:0;width:100%;min-height:calc(330px*var(--s));background:#fff}
.lab + .bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:10px;padding:10px 16px;font:600 calc(15px*var(--s)) var(--display);cursor:pointer;background:var(--mist);color:var(--ink)}
.btn:hover{background:#DCEAF6}
.btn.primary{background:var(--ink);color:#fff}.btn.primary:hover{background:var(--signal)}
.btn.green{background:var(--leaf);color:#fff}.btn.green:hover{filter:brightness(1.08)}
.btn:focus-visible,.nav a:focus-visible,.tools button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.explain{margin-top:14px;font-size:calc(16px*var(--s));color:var(--muted)}
.explain li{margin-bottom:4px}

.exo{background:var(--leaf-soft);border-radius:16px;padding:20px 24px;margin-bottom:16px}
.exo h4{margin:0 0 8px;font-size:calc(19px*var(--s))}
.exo ol{margin:0;padding-left:24px}.exo li{margin-bottom:6px}
.exo .defi{margin-top:12px;background:var(--paper);border-radius:12px;padding:10px 14px;font-size:calc(15px*var(--s))}
.exo .defi b{color:#A0620A}
.solution{margin-top:14px;border-radius:16px;overflow:hidden;border:2px solid var(--leaf)}
.solution .pane-h{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.solution pre{margin:0;padding:16px 18px;background:var(--codebg);color:var(--codefg);font:calc(15px*var(--s))/1.6 var(--mono);overflow:auto;white-space:pre}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:50px;padding-top:24px;border-top:2px solid var(--line)}

<script>
(function(){
/* ---------------------------------------------------------------
   Contenu du cours. Chaque leçon : cours, application, exercice.

---------------------------------------------------------------- */
const L=[
{
 t:"La structure d'une page", short:"Structure",
 intro:"Toute page web suit le même squelette. Une fois qu'on le connaît, on peut créer n'importe quelle page.",
 cours:`<p>Une page web est un simple fichier texte qui se termine par <code>.html</code>. Le navigateur lit ce fichier et affiche son contenu.</p>
<p>Le HTML entoure chaque contenu de <b>balises</b> : une balise ouvrante <code>&lt;p&gt;</code> et une balise fermante <code>&lt;/p&gt;</code>. Une balise peut porter des <b>attributs</b>, écrits dans la balise ouvrante : <code>nom="valeur"</code>.</p>
<ul class="points"><li>Le <b>head</b> contient les informations cachées : l'encodage, le titre de l'onglet.</li><li>Le <b>body</b> contient tout ce qui s'affiche.</li><li>Une balise ouverte à l'intérieur d'une autre se ferme avant elle.</li></ul>`,
 syntax:[["<!DOCTYPE html>","Page HTML moderne"],["<html lang=\"fr\">","Début, langue française"],["<meta charset=\"UTF-8\">","Les accents s'affichent"],["<title>","Titre de l'onglet"],["<body>","Ce qui s'affiche"]],
 tip:"Dans VS Code, tapez <code>!</code> puis <kbd>Tab</kbd> dans un fichier .html vide : le squelette s'écrit tout seul.",
 app:`<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ma première page</title>
</head>
<body>
  <h1>Bonjour Belfaa !</h1>
  <p>Je découvre le HTML.</p>
</body>
</html>`,
 appNotes:["Changez le texte du <code>title</code> : regardez le nom de l'onglet au-dessus de l'aperçu.","Supprimez <code>&lt;/h1&gt;</code> : que devient le paragraphe ?"],
 exo:{titre:"La page de ma ville",consignes:["Écrivez le squelette complet d'une page HTML en français.","Le titre de l'onglet doit être « Ma ville ».","Ajoutez un titre principal avec le nom de votre ville.","Ajoutez un paragraphe de deux phrases qui la présente."],
  defi:"Ajoutez un second paragraphe sur ce que vous aimez dans votre ville.",
  start:`<\!-- Écrivez votre page ici -->
`,
  sol:`<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ma ville</title>
</head>
<body>
  <h1>Belfaa</h1>
  <p>Belfaa est une ville de la province de Chtouka Aït Baha. Elle est connue pour son agriculture et son souk.</p>
</body>
</html>`}
},
{
 t:"Les titres", short:"Titres",
 intro:"Les titres organisent une page comme le sommaire d'un livre, du plus important au moins important.",
 cours:`<p>HTML propose six niveaux de titres, de <code>&lt;h1&gt;</code> (le plus important) à <code>&lt;h6&gt;</code>. Le navigateur les affiche du plus grand au plus petit.</p>
<ul class="points"><li>Un seul <code>h1</code> par page : c'est le titre principal.</li><li>On respecte l'ordre : pas de <code>h4</code> directement après un <code>h2</code>.</li><li>On choisit un titre selon son <b>importance</b>, jamais selon sa taille : la taille se règle en CSS.</li></ul>`,
 syntax:[["<h1>…</h1>","Titre principal"],["<h2>…</h2>","Grande partie"],["<h3>…</h3>","Sous-partie"],["<h4> à <h6>","Niveaux plus fins, plus rares"]],
 tip:"Google et les lecteurs d'écran utilisent les titres pour comprendre le plan de la page.",
 app:`<h1>Coopérative Argan Belfaa</h1>
<h2>Nos produits</h2>
<h3>Huile d'argan</h3>
<h3>Amlou</h3>
<h2>Contact</h2>`,
 appNotes:["Ajoutez un <code>h3</code> « Miel » sous « Nos produits ».","Changez un <code>h2</code> en <code>h5</code> et comparez la taille."],
 exo:{titre:"Le sommaire d'un livre de cuisine",consignes:["Un titre principal : « Cuisine marocaine ».","Trois parties en h2 : Entrées, Plats, Desserts.","Sous chaque partie, deux plats en h3 (par exemple : Harira, Zaalouk…)."],
  defi:"Sous un plat, ajoutez deux h4 : « Ingrédients » et « Préparation ».",
  start:"",
  sol:`<h1>Cuisine marocaine</h1>
<h2>Entrées</h2>
<h3>Harira</h3>
<h3>Zaalouk</h3>
<h2>Plats</h2>
<h3>Tajine de poulet</h3>
<h3>Couscous aux sept légumes</h3>
<h2>Desserts</h2>
<h3>Cornes de gazelle</h3>
<h3>Sellou</h3>`}
},
{
 t:"Paragraphes et retours à la ligne", short:"Paragraphes",
 intro:"Le navigateur ne respecte pas les espaces ni les retours à la ligne tapés dans le code. Il faut des balises pour cela.",
 cours:`<p>Un paragraphe s'écrit avec <code>&lt;p&gt;</code>. Le navigateur ajoute automatiquement un espace avant et après.</p>
<p>Plusieurs espaces ou des retours à la ligne dans le code comptent comme <b>un seul espace</b>. Pour aller à la ligne dans un paragraphe, on utilise <code>&lt;br&gt;</code>.</p>
<ul class="points"><li><code>&lt;br&gt;</code> et <code>&lt;hr&gt;</code> n'ont pas de balise fermante.</li><li>On utilise <code>&lt;br&gt;</code> avec modération : une adresse, un poème. Pour séparer des idées, on fait plusieurs paragraphes.</li></ul>`,
 syntax:[["<p>…</p>","Paragraphe"],["<br>","Retour à la ligne"],["<hr>","Ligne de séparation"]],
 tip:"Pour vérifier, ajoutez dix espaces entre deux mots dans l'application : un seul s'affiche.",
 app:`<p>Belfaa est      une ville
      agricole.</p>
<p>Adresse :<br>Avenue Mohammed V<br>Belfaa</p>
<hr>
<p>Fin de la page.</p>`,
 appNotes:["Ajoutez une ligne à l'adresse avec <code>&lt;br&gt;</code>.","Ajoutez un deuxième <code>&lt;hr&gt;</code> entre les deux premiers paragraphes."],
 exo:{titre:"Une carte postale",consignes:["Un titre h1 : « Bonjour de Belfaa ».","Deux paragraphes : ce que vous voyez, ce que vous faites.","Une ligne de séparation.","L'adresse du destinataire sur trois lignes, dans un seul paragraphe."],
  defi:"Terminez par une signature en paragraphe, après une deuxième ligne de séparation.",
  start:"",
  sol:`<h1>Bonjour de Belfaa</h1>
<p>Il fait beau aujourd'hui et le souk est plein de monde.</p>
<p>Je commence une formation pour devenir développeur web.</p>
<hr>
<p>Mohamed Alami<br>12 rue des Orangers<br>Agadir</p>
<hr>
<p>À bientôt, Youssef</p>`}
},
{
 t:"Mettre du texte en évidence", short:"Mise en évidence",
 intro:"Certaines balises donnent un sens particulier à un mot : important, insistance, surlignage, indice…",
 cours:`<p>Ces balises s'utilisent <b>à l'intérieur</b> d'un paragraphe ou d'un titre, autour de quelques mots.</p>
<ul class="points"><li><code>strong</code> signale un texte important (affiché en gras).</li><li><code>em</code> marque une insistance (affiché en italique).</li><li>Les lecteurs d'écran des personnes aveugles prononcent ces mots avec une autre intonation.</li></ul>`,
 syntax:[["<strong>","Important"],["<em>","Insistance"],["<mark>","Surligné"],["<sub> / <sup>","Indice / exposant"],["<small>","Petite note"]],
 tip:"Les anciennes balises <code>&lt;b&gt;</code> et <code>&lt;i&gt;</code> existent encore, mais <code>strong</code> et <code>em</code> donnent du sens.",
 app:`<p>Le cours commence à <strong>9h00</strong>.</p>
<p>C'est <em>vraiment</em> important.</p>
<p>Promo : <mark>-20 %</mark> ce mois-ci</p>
<p>L'eau : H<sub>2</sub>O. Surface : 50 m<sup>2</sup></p>
<p><small>Prix indicatifs.</small></p>`,
 appNotes:["Mettez « ce mois-ci » en <code>em</code>.","Écrivez le CO<sub>2</sub> avec <code>sub</code>."],
 exo:{titre:"Une annonce immobilière",consignes:["Titre h1 : « Appartement à louer ».","Un paragraphe avec la surface « 80 m² » (le 2 en exposant).","Le prix en strong : 2 500 DH par mois.","« Libre immédiatement » surligné avec mark.","Une petite note : « Charges non comprises »."],
  defi:"Ajoutez un mot en em et un commentaire de votre choix.",
  start:"",
  sol:`<h1>Appartement à louer</h1>
<p>Bel appartement de 80 m<sup>2</sup> au centre de Belfaa.</p>
<p>Prix : <strong>2 500 DH par mois</strong>.</p>
<p><mark>Libre immédiatement</mark></p>
<p><small>Charges non comprises.</small></p>`}
},
{
 t:"Commentaires et caractères spéciaux", short:"Commentaires",
 intro:"Les commentaires sont des notes invisibles. Les entités servent à afficher les caractères réservés du HTML.",
 cours:`<p>Un commentaire s'écrit entre <code>&lt;!--</code> et <code>--&gt;</code>. Il n'apparaît pas dans la page, mais tout le monde peut le lire avec F12 : jamais de secret dedans.</p>
<p>Les caractères <code>&lt;</code> et <code>&gt;</code> servent à écrire les balises. Pour les afficher dans une page, on utilise une <b>entité</b> : un code qui commence par <code>&amp;</code> et finit par <code>;</code>.</p>`,
 syntax:[["&lt;","<"],["&gt;",">"],["&amp;","&"],["&nbsp;","Espace insécable"],["&copy;","©"]],
 tip:"Dans VS Code, <kbd>Ctrl</kbd> + <kbd>:</kbd> transforme une ligne en commentaire.",
 app:`<\!-- En-tête de la page -->
<h1>Mon cours</h1>

<\!-- TODO : ajouter une photo -->
<p>La balise &lt;p&gt; crée un paragraphe.</p>
<p>Huile &amp; amlou : 120&nbsp;DH</p>
<p>&copy; 2026 Digital School</p>`,
 appNotes:["Écrivez <code>3 &lt; 5</code> sans entité et observez.","Ajoutez un commentaire : il ne s'affiche pas."],
 exo:{titre:"Une fiche de révision",consignes:["Un h1 « Mes balises ».","Trois paragraphes qui affichent exactement : « La balise &lt;h1&gt; est un titre », « La balise &lt;p&gt; est un paragraphe », « La balise &lt;br&gt; va à la ligne ».","Un commentaire avant chaque paragraphe.","Un pied de page en paragraphe : « © 2026 » suivi de votre prénom."],
  defi:"Ajoutez « Questions & réponses » en h2 en utilisant l'entité de &.",
  start:"",
  sol:`<h1>Mes balises</h1>
<\!-- Les titres -->
<p>La balise &lt;h1&gt; est un titre</p>
<\!-- Les paragraphes -->
<p>La balise &lt;p&gt; est un paragraphe</p>
<\!-- Le retour à la ligne -->
<p>La balise &lt;br&gt; va à la ligne</p>
<p>&copy; 2026 Salma</p>`}
},
{
 t:"Les listes", short:"Listes",
 intro:"Une liste présente plusieurs éléments de même nature : des produits, des étapes, des compétences.",
 cours:`<p><code>&lt;ul&gt;</code> crée une liste à puces : l'ordre n'a pas d'importance. <code>&lt;ol&gt;</code> crée une liste numérotée : l'ordre compte, comme les étapes d'une recette.</p>
<p>Chaque élément s'écrit dans un <code>&lt;li&gt;</code> (<i>list item</i>).</p>
<ul class="points"><li>Une sous-liste se place <b>à l'intérieur</b> d'un <code>li</code>, avant sa fermeture.</li><li><code>start="3"</code> fait commencer la numérotation à 3, <code>type="A"</code> utilise des lettres.</li></ul>`,
 syntax:[["<ul>","Liste à puces"],["<ol>","Liste numérotée"],["<li>","Un élément"],["<ol start=\"3\">","Commencer à 3"],["<ol type=\"A\">","A, B, C… (aussi a, I, i)"]],
 tip:"Les menus de presque tous les sites sont des listes <code>ul</code> mises en forme avec le CSS.",
 app:`<h3>Produits du souk</h3>
<ul>
  <li>Huile d'argan</li>
  <li>Miel</li>
</ul>

<ol>

  <li>Rincer le thé</li>
  <li>Ajouter la menthe</li>
</ol>`,
 appNotes:["Ajoutez « Amlou » dans la première liste.","Ajoutez <code>type=\"I\"</code> à la liste numérotée."],
 exo:{titre:"Le programme de la formation",consignes:["Un h1 « Ma formation ».","Une liste à puces de vos 3 passions.","Une liste numérotée des 3 étapes pour créer une page web (créer le fichier, écrire le code, ouvrir dans Chrome).","Une liste « Phases » : Front-end (avec la sous-liste HTML, CSS, JavaScript) et Back-end (avec la sous-liste Node.js, MySQL)."],

    </ul>
  </li>
</ul>`}
},
{
 t:"Les liens", short:"Liens",
 intro:"Les liens relient les pages entre elles : c'est le « HyperText » de HTML.",
 cours:`<p>Un lien s'écrit avec <code>&lt;a&gt;</code>. L'attribut <code>href</code> indique la destination, le contenu est le texte cliquable.</p>
<ul class="points"><li><b>Externe</b> : une adresse complète, avec <code>https://</code>.</li><li><b>Interne</b> : le nom d'une page de votre site, <code>contact.html</code>.</li><li><b>Ancre</b> : <code>#contact</code> mène à l'élément qui a <code>id="contact"</code>.</li><li><code>target="_blank"</code> ouvre le lien dans un nouvel onglet.</li></ul>
<p>Écrivez un texte de lien clair : « Voir nos produits », jamais « cliquez ici ».</p>`,
 syntax:[["<a href=\"https://…\">","Vers un autre site"],["<a href=\"page.html\">","Vers une page du site"],["<a href=\"#id\">","Vers une partie de la page"],["<a href=\"mailto:…\">","Écrire un e-mail"],["target=\"_blank\"","Nouvel onglet"]],
 tip:"Dans l'aperçu, cliquez sur « Aller au contact » : la page descend jusqu'à la section. Les liens vers d'autres sites ne s'ouvrent pas dans l'aperçu.",
 app:`<p><a href="#contact">Aller au contact</a></p>
<p>Documentation : <a href="https://developer.mozilla.org/fr" target="_blank">MDN</a></p>
<p>Voir la <a href="produits.html">page produits</a>.</p>
<br><br><br><br><br><br><br><br><br><br>
<h2 id="contact">Contact</h2>
<p>Écrivez-nous : <a href="mailto:contact@exemple.ma">contact@exemple.ma</a></p>`,
 appNotes:["Ajoutez un lien « Retour en haut » qui mène à <code>#</code>.","Changez le texte du lien MDN."],
 exo:{titre:"Ma page de liens utiles",consignes:["Un h1 avec <code>id=\"haut\"</code> : « Mes liens utiles ».","Un menu de deux liens vers les ancres #sites et #contact.","Une section h2 « Sites » (id=\"sites\") avec deux liens externes qui s'ouvrent dans un nouvel onglet.","Une section h2 « Contact » (id=\"contact\") avec un lien mailto.","Un lien « Retour en haut » à la fin."],
  defi:"Mettez les liens externes dans une liste ul.",

},
{
 t:"Les images", short:"Images",
 intro:"Une image s'insère avec une seule balise, sans fermeture. Elle doit toujours être décrite pour ceux qui ne la voient pas.",
 cours:`<p>La balise <code>&lt;img&gt;</code> a deux attributs obligatoires : <code>src</code>, le chemin vers le fichier, et <code>alt</code>, une description de l'image.</p>
<ul class="points"><li>Le texte <code>alt</code> est lu aux personnes aveugles et s'affiche si l'image ne charge pas.</li><li>Chemin relatif : <code>images/photo.jpg</code> depuis la page ; <code>../</code> pour remonter d'un dossier.</li><li><code>width="300"</code> fixe la largeur en pixels, la hauteur suit.</li><li>Photos en JPG ou WebP, logos en SVG ou PNG, moins de 300 Ko.</li></ul>`,
 syntax:[["<img src=\"…\" alt=\"…\">","Une image"],["width=\"300\"","Largeur en pixels"],["<figure>","Image + légende"],["<figcaption>","La légende"]],
 tip:"Dans cet aperçu, toutes les images sont remplacées par un dessin d'exemple, car vos fichiers ne sont pas ici. Sur votre ordinateur, mettez de vraies photos dans le dossier <code>images</code>.",
 app:`<figure>

},
{
 t:"Les tableaux", short:"Tableaux",
 intro:"Un tableau présente des données en lignes et en colonnes : des prix, un emploi du temps, des notes.",
 cours:`<p>Un tableau se construit <b>ligne par ligne</b>. Chaque ligne <code>&lt;tr&gt;</code> contient des cases : <code>&lt;th&gt;</code> pour un titre, <code>&lt;td&gt;</code> pour une donnée.</p>
<ul class="points"><li><code>caption</code> donne un titre au tableau.</li><li><code>thead</code>, <code>tbody</code>, <code>tfoot</code> séparent l'en-tête, les données et le total.</li><li>Un tableau sert aux données, jamais à placer les blocs d'un site.</li></ul>
<p>Cette semaine, on ajoute <code>border="1"</code> pour voir les cases. C'est provisoire : les bordures se feront en CSS.</p>`,
 syntax:[["<table>","Le tableau"],["<tr>","Une ligne"],["<th>","Case de titre"],["<td>","Case de donnée"],["<caption>","Titre du tableau"],["<thead> <tbody> <tfoot>","En-tête, corps, pied"]],
 tip:"Avant de coder un tableau, dessinez-le sur papier et comptez les lignes et les colonnes.",
 app:`<table border="1">

 exo:{titre:"La liste de prix de l'épicerie",consignes:["Un tableau avec le titre « Prix de l'épicerie ».","Trois colonnes : Produit, Quantité, Prix (DH).","Quatre produits : Sucre 1 kg 8 DH, Thé 200 g 15 DH, Huile 1 L 20 DH, Farine 5 kg 30 DH.","Une ligne de total dans tfoot : 73 DH."],
  defi:"Ajoutez une colonne « Disponible » avec Oui ou Non.",
  start:`<table border="1">

</table>`,
  sol:`<table border="1">
  <caption>Prix de l'épicerie</caption>
  <thead>
    <tr><th>Produit</th><th>Quantité</th><th>Prix (DH)</th></tr>

/* --------------------------- rendu --------------------------- */
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const PH="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200"><rect width="320" height="200" fill="#87C3E8"/><rect y="120" width="320" height="80" fill="#E8C98A"/><circle cx="240" cy="70" r="30" fill="#F7B733"/><path d="M0 130 Q80 100 160 130 T320 130 V140 H0Z" fill="#4E9BC9"/></svg>');
const BASE='<style>body{font-family:"Times New Roman",Times,serif;font-size:18px;margin:14px 18px;color:#000;background:#fff}img{max-width:100%;height:auto}</style>';
function toDoc(code){
  let c=code.replace(/(<img\b[^>]*\bsrc=")(?!https?:|data:)[^"]*(")/gi,'$1'+PH+'$2');
  if(/<html[\s>]/i.test(c)||/<!doctype/i.test(c)) return c.replace(/<head>/i,'<head>'+BASE);
  return '<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">'+BASE+'</head><body>'+c+'</body></html>';
}
function titleOf(code){const m=/<title>([\s\S]*?)<\/title>/i.exec(code);return m?m[1].trim():'Aperçu dans le navigateur';}

function lab(id,code,label){
  return `<div class="lab" data-lab="${id}">
    <div class="pane code"><div class="pane-h"><span class="grow">${label}</span><span>modifiable</span></div>
      <textarea class="ed" id="${id}" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Éditeur de code : ${label}">${esc(code)}</textarea></div>
    <div class="pane"><div class="pane-h"><span class="dots"><i></i><i></i><i></i></span><span class="grow" data-title></span></div>
      <iframe class="pv" sandbox title="Résultat dans le navigateur"></iframe></div>
  </div>`;
}

const view=document.getElementById('view'), toc=document.getElementById('toc');
toc.innerHTML=L.map((l,i)=>`<li><a href="#lecon-${i+1}"><span class="n">${String(i+1).padStart(2,'0')}</span><span class="lbl">${l.short}</span></a></li>`).join('');

function render(i){
  const l=L[i], n=i+1, ex=l.exo;
  const prev=i>0?`<a class="prev" href="#lecon-${i}"><small>← Leçon ${i}</small>${L[i-1].t}</a>`:'';
  const next=i<L.length-1?`<a class="next" href="#lecon-${i+2}"><small>Leçon ${i+2} →</small>${L[i+1].t}</a>`:'';
  view.innerHTML=`<article class="lesson">
    <span class="eyebrow">Leçon ${n} sur ${L.length}</span>
    <h2 class="title">${l.t}</h2>
    <p class="intro">${l.intro}</p>

    <h3 class="part"><span class="tag t-cours">Cours</span>Ce qu'il faut savoir</h3>
    <div class="cours"><div>${l.cours}</div>
      <div><div class="syntax"><h4>À retenir</h4><table>${l.syntax.map(r=>`<tr><td><code>${esc(r[0])}</code></td><td>${r[1]}</td></tr>`).join('')}</table></div>
      <div class="tip"><b>Astuce · </b>${l.tip}</div></div></div>

    <h3 class="part"><span class="tag t-app">Application</span>On essaie ensemble</h3>
    ${lab('app-'+n,l.app,'exemple.html')}
    <div class="bar"><button class="btn" data-reset="app-${n}">Réinitialiser l'exemple</button></div>
    <ul class="explain">${l.appNotes.map(x=>`<li>À essayer : ${x}</li>`).join('')}</ul>

    <h3 class="part"><span class="tag t-exo">Exercice</span>${ex.titre}</h3>
    <div class="exo"><h4>Consignes</h4><ol>${ex.consignes.map(c=>`<li>${c}</li>`).join('')}</ol>
      <div class="defi"><b>Défi · </b>${ex.defi}</div></div>
    ${lab('exo-'+n,ex.start,'exercice.html')}
    <div class="bar">
      <button class="btn" data-reset="exo-${n}">Effacer mon travail</button>
      <button class="btn primary" data-sol="${n}" aria-expanded="false">Afficher la correction</button>
    </div>
    <div class="solution" id="sol-${n}" hidden>
      <div class="pane-h"><span class="grow">Correction proposée</span><button class="btn" data-load="${n}" style="padding:4px 10px">Mettre dans l'éditeur</button></div>
      <pre>${esc(ex.sol)}</pre>
    </div>
    <nav class="pager" aria-label="Leçons">${prev}${next}</nav>
  </article>`;
  view.querySelectorAll('.lab').forEach(setup);
  toc.querySelectorAll('a').forEach((a,k)=>{ if(k===i) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const cur=toc.querySelector('[aria-current]'); if(cur&&cur.scrollIntoView) cur.scrollIntoView({block:'nearest',inline:'nearest'});
  window.scrollTo(0,0);
}

const originals={};
function setup(box){
  const ta=box.querySelector('textarea'), fr=box.querySelector('iframe'), tl=box.querySelector('[data-title]');
  originals[ta.id]=ta.value;
  let t=null;
  const upd=()=>{fr.srcdoc=toDoc(ta.value); tl.textContent=titleOf(ta.value);};
  ta.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(upd,250);});
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'&&!e.shiftKey&&!e.ctrlKey&&!e.altKey){
      e.preventDefault(); const s=ta.selectionStart,en=ta.selectionEnd;
      ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(en); ta.selectionStart=ta.selectionEnd=s+2; ta.dispatchEvent(new Event('input'));
    }
  });
  upd();
}
view.addEventListener('click',e=>{
  const r=e.target.closest('[data-reset]'); if(r){const ta=document.getElementById(r.dataset.reset); ta.value=originals[ta.id]; ta.dispatchEvent(new Event('input')); ta.focus(); return;}
  const s=e.target.closest('[data-sol]'); if(s){const box=document.getElementById('sol-'+s.dataset.sol); box.hidden=!box.hidden; s.setAttribute('aria-expanded',String(!box.hidden)); s.textContent=box.hidden?'Afficher la correction':'Masquer la correction'; return;}
  const ld=e.target.closest('[data-load]'); if(ld){const n=ld.dataset.load; const ta=document.getElementById('exo-'+n); ta.value=L[n-1].exo.sol; ta.dispatchEvent(new Event('input')); return;}
});

function route(){const m=/^#lecon-(\d+)$/.exec(location.hash); let i=m?parseInt(m[1],10)-1:0; if(!(i>=0&&i<L.length)) i=0; render(i);}
window.addEventListener('hashchange',route);

/* taille du texte (pratique au vidéoprojecteur) */
let scale=1; try{const v=parseFloat(localStorage.getItem('coursHtmlScale')); if(v>=.8&&v<=1.6) scale=v;}catch(e){}
function setScale(v){scale=Math.min(1.6,Math.max(.8,Math.round(v*10)/10)); document.documentElement.style.setProperty('--s',scale); try{localStorage.setItem('coursHtmlScale',scale);}catch(e){}}
document.getElementById('bigger').onclick=()=>setScale(scale+.1);
document.getElementById('smaller').onclick=()=>setScale(scale-.1);
setScale(scale);
route();
})();
</script>
